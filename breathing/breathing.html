<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Breathing Flows</title>
<!--
  Five strange-attractor particle flows that billow to a box-breathing pattern:
  inhale 4 s, hold 4 s, exhale 4 s, hold 4 s.

  Every frame is a pure function of time, so one 16 s cycle loops with no seam.
  Particles ride precomputed attractor trajectories; the breath scales, billows and paces the flow.

  URL parameters:
    ?a=0..4      which flow (tide, lavender, dawn, moon, rose)
    &phase=4     seconds per phase (the box side)
    &size=1080   canvas size in pixels (square)
    &labels=1    show "Breathe in / Hold / Breathe out / Hold" and a count
    &offline     do not start the clock; drive window.renderFrame(i) yourself
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vmin; max-height: 100vmin; }
  #label {
    position: absolute; left: 0; right: 0; bottom: 9vmin; text-align: center; pointer-events: none;
    font: 300 4.2vmin/1.3 "DejaVu Sans", system-ui, sans-serif; letter-spacing: 0.12em; color: rgba(255,255,255,0.86);
    text-shadow: 0 0 2vmin rgba(0,0,0,0.6); display: none;
  }
  #label small { display: block; font-size: 2.6vmin; opacity: 0.6; letter-spacing: 0.3em; margin-top: 0.8vmin; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas><div id="label"></div></div>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const FPS = 30;
const PHASE = +(Q.get('phase') || 4);
const CYCLE = PHASE * 4;
const SIZE = +(Q.get('size') || 1080);
const LABELS = Q.get('labels') === '1';

// ---------- breath curve ----------
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, x)));
// b: lung fullness 0..1 ; phase index 0 inhale, 1 hold full, 2 exhale, 3 hold empty
function breath(t) {
  const u = ((t % CYCLE) + CYCLE) % CYCLE, k = Math.floor(u / PHASE), f = (u - k * PHASE) / PHASE;
  return [ease(f), 1, 1 - ease(f), 0][k];
}
// flow progress F(t) in [0,1) per cycle: fast while breathing, a slow drift while holding
const DRIFT = 0.35;
function flow(t) {
  const u = ((t % CYCLE) + CYCLE) % CYCLE, k = Math.floor(u / PHASE), f = (u - k * PHASE) / PHASE;
  // total variation of b so far (0..2), plus a constant drift
  const tv = [ease(f), 1, 1 + ease(f), 2][k];
  return (DRIFT * u / PHASE + tv) / (DRIFT * 4 + 2);
}

// ---------- the five flows ----------
const FLOWS = [
  { name: 'Tide', sys: 'aizawa',
    f: (x, y, z) => [(z - 0.7) * x - 3.5 * y, 3.5 * x + (z - 0.7) * y, 0.6 + 0.95 * z - z * z * z / 3 - (x * x + y * y) * (1 + 0.25 * z) + 0.1 * z * x * x * x],
    h: 0.002, start: [0.1, 0, 0], map: (x, y, z) => [x, z, y], elev: 0.42, yaw: 0.3,
    wind: { axis: 'x', spinAxis: 'y', twist: 3.2, kH: 1.3, kS: 0.6, spin: 2 * Math.PI, squash: 0.55 },
    bg: [0x031418, 0x000506], cols: [0x2fbfb0, 0xb6f5e6, 0x2a6f9a], glow: 0x1f8a86 },
  { name: 'Lavender', sys: 'thomas',
    f: (x, y, z) => { const b = 0.1; return [Math.sin(y) - b * x, Math.sin(z) - b * y, Math.sin(x) - b * z]; },
    h: 0.01, start: [0.1, 0, 0], map: null /* look down the (1,1,1) axis */, elev: 0.15, yaw: 0.0, gain: 0.4,
    wind: { axis: 'z', twist: 3.4, kH: 0.2, kS: 1.0, spin: 2 * Math.PI / 3, squash: 0.6 },
    bg: [0x0f0b20, 0x040309], cols: [0x9d8ae0, 0xf1e9ff, 0x5b62c8], glow: 0x6d5bb8 },
  { name: 'Dawn', sys: 'lorenz',
    f: (x, y, z) => [10 * (y - x), x * (28 - z) - y, x * y - 8 / 3 * z],
    h: 0.0005, start: [1, 1, 1], map: (x, y, z) => [x, z, y], elev: 0.2, yaw: -0.45,
    bg: [0x1c0f0a, 0x070302], cols: [0xff9e6b, 0xffe6c7, 0xd9605a], glow: 0xc2653e },
  { name: 'Moon', sys: 'rossler',
    f: (x, y, z) => [-y - z, x + 0.2 * y, 0.2 + z * (x - 5.7)],
    h: 0.002, start: [1, 1, 0], map: (x, y, z) => [x, z, -y], elev: 0.55, yaw: 0.6,
    bg: [0x070c1a, 0x010207], cols: [0x8fa9ff, 0xf0f4ff, 0x4d64c0], glow: 0x4a63b0 },
  { name: 'Rose', sys: 'four-wing',
    f: (x, y, z) => [0.2 * x + y * z, -0.01 * x - 0.4 * y - x * z, -z - x * y],
    h: 0.004, start: [1, 1, 1], map: (x, y, z) => [x, y, z], elev: 0.05, yaw: 0.0, fit: 1.0, gain: 0.8,
    bg: [0x1a0912, 0x060205], cols: [0xff93b0, 0xffe4eb, 0xb4508a], glow: 0xa84a74 },
];
const A = FLOWS[Math.min(4, Math.max(0, +(Q.get('a') || 0)))];
// motion: 'bloom' (default) closes into a twisted seed and unfurls; 'swell' is the first version (scale only)
const MOTION = Q.get('motion') === 'swell' ? 0 : 1;
const WIND = Object.assign({ axis: 'y', twist: 2.6, kH: 0.6, kS: 0.9, spin: 2 * Math.PI, squash: 0.5 }, A.wind || {});
const S_MIN = 0.16;      // seed size relative to the open form
const LAG = MOTION ? 0.25 : 0.25;   // seconds between radial breath samples (centre -> edge)
if (Q.has('yaw')) A.yaw = +Q.get('yaw');
if (Q.has('elev')) A.elev = +Q.get('elev');
if (Q.has('map')) { const m = Q.get('map'); A.map = (x, y, z) => { const v = { x, y, z, X: -x, Y: -y, Z: -z }; return [...m].map(ch => v[ch]); }; }
document.title = 'Box Breathing - ' + A.name;

// ---------- trajectory: RK4, burn-in, normalise, resample by arc length ----------
const TW = 1024, TH = 1024, M = TW * TH;      // samples stored
const DS = 0.0035;                           // arc length between samples (normalised units)
function rk4(f, p, h) {
  const [x, y, z] = p;
  const k1 = f(x, y, z), k2 = f(x + k1[0] * h / 2, y + k1[1] * h / 2, z + k1[2] * h / 2);
  const k3 = f(x + k2[0] * h / 2, y + k2[1] * h / 2, z + k2[2] * h / 2), k4 = f(x + k3[0] * h, y + k3[1] * h, z + k3[2] * h);
  return [x + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), y + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]), z + h / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2])];
}
function diagMap() {
  // rotate so (1,1,1) points at the camera (world +z), giving Thomas its three-fold symmetry
  const w = [1 / Math.sqrt(3), 1 / Math.sqrt(3), 1 / Math.sqrt(3)];
  const u = [1 / Math.sqrt(2), -1 / Math.sqrt(2), 0], v = [w[1] * u[2] - w[2] * u[1], w[2] * u[0] - w[0] * u[2], w[0] * u[1] - w[1] * u[0]];
  return (x, y, z) => [u[0] * x + u[1] * y + u[2] * z, v[0] * x + v[1] * y + v[2] * z, w[0] * x + w[1] * y + w[2] * z];
}
function buildTrajectory() {
  const map = A.map || diagMap();
  let p = A.start;
  for (let i = 0; i < 200000; i++) p = rk4(A.f, p, A.h);
  // estimate centre and radius from a probe run
  const probe = [];
  let q = p;
  for (let i = 0; i < 400000; i++) { q = rk4(A.f, q, A.h); if (i % 20 === 0) probe.push(map(...q)); }
  const c = [0, 1, 2].map(j => { const s = probe.map(v => v[j]).sort((a, b) => a - b); return (s[Math.floor(s.length * 0.01)] + s[Math.floor(s.length * 0.99)]) / 2; });
  const r = probe.map(v => Math.hypot(v[0] - c[0], v[1] - c[1], v[2] - c[2])).sort((a, b) => a - b)[Math.floor(probe.length * 0.985)];
  const sc = (A.fit || 1.25) / r;
  const out = new Float32Array(M * 4);
  let prev = map(...p).map((v, j) => (v - c[j]) * sc), acc = 0, n = 0;
  out.set([...prev, 0], 0); n = 1;
  let guard = 0;
  while (n < M && guard++ < 4e8) {
    p = rk4(A.f, p, A.h);
    const w = map(...p).map((v, j) => (v - c[j]) * sc);
    acc += Math.hypot(w[0] - prev[0], w[1] - prev[1], w[2] - prev[2]);
    prev = w;
    if (acc >= DS) { out[4 * n] = w[0]; out[4 * n + 1] = w[1]; out[4 * n + 2] = w[2]; out[4 * n + 3] = 0; acc -= DS; n++; }
  }
  return out;
}

// ---------- GL ----------
const canvas = document.getElementById('gl');
canvas.width = canvas.height = SIZE;
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
if (!gl) throw new Error('WebGL2 required');
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, '#version 300 es\nprecision highp float;\nprecision highp int;\n' + src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
function tex(w, h, fmt, data, filter) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  const f = filter || gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const [ifmt, type] = fmt === 'f32' ? [gl.RGBA32F, gl.FLOAT] : [gl.RGBA16F, gl.HALF_FLOAT];
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, gl.RGBA, type, data || null);
  return t;
}
function fbo(t) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; }
const quadVS = `out vec2 uv; void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); uv = p; gl_Position = vec4(p*2.0-1.0,0,1); }`;
const vao = gl.createVertexArray();
function quad() { gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3); }
const rgb = h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];
const lin = c => c.map(v => Math.pow(v, 2.2));

const trajT = tex(TW, TH, 'f32', buildTrajectory());

// particles: each owns a random start on the trajectory and a random phase offset
const PS = 512, N = PS * PS, TRAIL = 3;
const SEG = Math.round(1.9 / DS);           // samples travelled per cycle (~1.9 units)
let seed = 4242; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const pdata = new Float32Array(N * 4);
for (let k = 0; k < N; k++) { pdata[4 * k] = Math.floor(rnd() * (M - SEG - 64)); pdata[4 * k + 1] = rnd(); pdata[4 * k + 2] = rnd(); pdata[4 * k + 3] = rnd(); }
const partT = tex(PS, PS, 'f32', pdata);

const noise = `
vec3 hash3(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6))); return fract(sin(p)*43758.5453)*2.0-1.0; }
float gnoise(vec3 p){
  vec3 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f);
  return mix(mix(mix(dot(hash3(i),f), dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);
}`;

const draw = prog(noise + `
uniform sampler2D traj, parts;
uniform mat4 mvp;
uniform float F, pscale, alpha, t01;
uniform int motion, axisMode, spinMode;   // wind and spin axes: 0 = y, 1 = z, 2 = x
uniform float twist, kH, kS, spin, squash, sMin;
uniform vec4 bLag;        // breath fullness sampled at 4 radial lags (centre -> edge)
uniform vec3 c0, c1, c2;
out vec3 col;
vec3 at(float idx){
  float i0 = floor(idx); float fr = idx - i0;
  int a = int(i0), b = a + 1;
  vec3 p0 = texelFetch(traj, ivec2(a % ${TW}, a / ${TW}), 0).xyz, p1 = texelFetch(traj, ivec2(b % ${TW}, b / ${TW}), 0).xyz;
  return mix(p0, p1, fr);
}
void main(){
  int id = gl_VertexID / ${TRAIL}, tr = gl_VertexID % ${TRAIL};
  vec4 P = texelFetch(parts, ivec2(id % ${PS}, id / ${PS}), 0);
  float ph = fract(F + P.y);
  float idx = P.x + ph * float(${SEG}) - float(tr) * 5.0;
  vec3 p = at(idx);
  vec3 pOrig = p;
  // billow: the breath reaches the edge a little after the centre, and the surface swells unevenly
  float r = length(p);
  float x = clamp(r / 1.3, 0.0, 1.0) * 3.0;
  float b = x < 1.0 ? mix(bLag.x, bLag.y, x) : x < 2.0 ? mix(bLag.y, bLag.z, x - 1.0) : mix(bLag.z, bLag.w, x - 2.0);
  float ang = t01 * 6.2831853;
  vec3 nc = p * 1.1 + vec3(cos(ang), sin(ang), 0.0) * 0.9;
  vec3 n = vec3(gnoise(nc), gnoise(nc + vec3(17.1, 3.3, -9.2)), gnoise(nc + vec3(-4.7, 21.9, 5.5)));
  float bright = 1.0, shrink = 1.0;
  if (motion == 0) {
    float scale = 0.8 + 0.28 * b;
    p = p * scale * (1.0 + 0.10 * b * gnoise(p * 1.7 + vec3(0.0, 0.0, cos(ang) * 0.7)));
    p += n * (0.035 + 0.06 * b);
  } else {
    // bloom: closed (c = 1) is a small, tightly wound seed; open (c = 0) is the full attractor
    float c = smoothstep(0.0, 1.0, 1.0 - b);
    float h = axisMode == 1 ? p.z : axisMode == 2 ? p.x : p.y;
    vec2 q = axisMode == 1 ? p.xy : axisMode == 2 ? p.yz : p.xz;
    float rr = length(q);
    float rn = clamp(rr / 1.3, 0.0, 1.0);
    // edges curl in harder than the centre, and the form flattens along its axis as it closes
    q *= 1.0 - 0.5 * c * smoothstep(0.15, 1.0, rn);
    h *= mix(1.0, squash, c);
    // wind: a corkscrew along the axis plus a vortex where the centre turns most, on top of a steady spin
    // the twist leads the closing and lets go late in the opening, so the form visibly unwinds as it grows
    float tw = smoothstep(0.0, 0.55, c);
    float th = twist * tw * (kH * h + kS * (1.0 - rn));
    float cs = cos(th), sn = sin(th);
    q = vec2(cs * q.x - sn * q.y, sn * q.x + cs * q.y);
    p = axisMode == 1 ? vec3(q, h) : axisMode == 2 ? vec3(h, q) : vec3(q.x, h, q.y);
    // steady spin, which keeps turning one way through the whole cycle
    float ss = sin(spin), sc0 = cos(spin);
    if (spinMode == 0) p.xz = vec2(sc0 * p.x - ss * p.z, ss * p.x + sc0 * p.z);
    else if (spinMode == 1) p.xy = vec2(sc0 * p.x - ss * p.y, ss * p.x + sc0 * p.y);
    else p.yz = vec2(sc0 * p.y - ss * p.z, ss * p.y + sc0 * p.z);
    float sc = mix(1.06, sMin, c);
    p = p * sc * (1.0 + 0.08 * b * gnoise(p * 1.7 + vec3(0.0, 0.0, cos(ang) * 0.7)));
    p += n * (0.012 + 0.05 * b) * mix(1.0, 0.4, c);
    // the same particles packed into a small seed would blow out: dim by area, shrink the points a little
    bright = pow(sc / 1.06, 1.25);
    shrink = mix(1.0, 0.7, c);
  }
  gl_Position = mvp * vec4(p, 1.0);
  gl_PointSize = pscale * shrink / gl_Position.w;
  float fade = smoothstep(0.0, 0.18, ph) * (1.0 - smoothstep(0.82, 1.0, ph));
  vec3 c = mix(c0, c2, smoothstep(-1.0, 1.0, pOrig.y + (P.z - 0.5) * 0.8));
  c = mix(c, c1, pow(P.w, 3.0) * 0.8);
  col = c * alpha * bright * fade * (1.0 - float(tr) * 0.3) * (0.75 + 0.35 * b);
}`, `
in vec3 col; out vec4 o;
void main(){ vec2 d = gl_PointCoord - 0.5; float r = dot(d,d); if (r > 0.25) discard; o = vec4(col * (1.0 - r*3.2), 1.0); }`);

const hdrT = tex(SIZE, SIZE, 'f16', null, gl.LINEAR), hdrF = fbo(hdrT);
const QS = SIZE >> 2;
const blA = tex(QS, QS, 'f16', null, gl.LINEAR), blB = tex(QS, QS, 'f16', null, gl.LINEAR), blAF = fbo(blA), blBF = fbo(blB);
const down = prog(quadVS, `in vec2 uv; out vec4 o; uniform sampler2D a; uniform vec2 px;
void main(){ vec3 c = vec3(0); for (int i=-1;i<=1;i++) for (int j=-1;j<=1;j++) c += texture(a, uv + vec2(i,j)*px).rgb; o = vec4(max(c/9.0 - 0.25, 0.0), 1.0); }`);
const blur = prog(quadVS, `in vec2 uv; out vec4 o; uniform sampler2D a; uniform vec2 dir;
void main(){ const float w[5] = float[](0.227,0.195,0.122,0.054,0.016); vec3 c = texture(a,uv).rgb*w[0];
 for (int i=1;i<5;i++){ c += texture(a,uv+dir*float(i)).rgb*w[i]; c += texture(a,uv-dir*float(i)).rgb*w[i]; } o = vec4(c,1.0); }`);
const comp = prog(quadVS, `in vec2 uv; out vec4 o; uniform sampler2D parts, bloom; uniform vec3 bg0, bg1, glow; uniform float b;
void main(){
  vec2 d = uv - 0.5; float r = length(d);
  vec3 bg = mix(bg0, bg1, smoothstep(0.0, 0.75, r));
  // a soft halo that fills and empties with the breath
  bg += glow * 0.10 * exp(-pow(r / (0.20 + 0.14 * b), 2.0)) * (0.5 + 0.7 * b);
  vec3 c = texture(parts, uv).rgb + texture(bloom, uv).rgb * 1.1;
  c = 1.0 - exp(-c * 1.1);
  c = bg + c * (1.0 - bg);
  c *= 1.0 - dot(d, d) * 0.6;
  // ordered dither to stop banding in the dark gradient
  float dth = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) - 0.5;
  o = vec4(pow(c, vec3(1.0/2.2)) + dth / 255.0, 1.0);
}`);

// ---------- camera ----------
function mat4Mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }
function persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]); }
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
function lookAt(e, c, up) { const z = norm(sub(e, c)), x = norm(cross(up, z)), y = cross(z, x); return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]); }
function camera(t) {
  // a slow sway, periodic in the cycle so the loop is seamless
  const w = 2 * Math.PI * t / CYCLE;
  const yaw = A.yaw + 0.22 * Math.sin(w), elev = A.elev + 0.06 * Math.sin(2 * w + 0.7), dist = 5.4;
  const eye = [Math.sin(yaw) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(yaw) * Math.cos(elev) * dist];
  return mat4Mul(persp(0.62, 1, 0.05, 50), lookAt(eye, [0, 0, 0], [0, 1, 0]));
}

// ---------- label ----------
const label = document.getElementById('label');
if (LABELS) label.style.display = 'block';
function setLabel(t) {
  const u = ((t % CYCLE) + CYCLE) % CYCLE, k = Math.floor(u / PHASE);
  const count = Math.min(PHASE, Math.floor(u - k * PHASE) + 1);
  label.innerHTML = ['Breathe in', 'Hold', 'Breathe out', 'Hold'][k] + '<small>' + count + '</small>';
}

// ---------- frame ----------
const C = A.cols.map(h => lin(rgb(h)));
function renderFrame(i) {
  const t = i / FPS;
  const b = breath(t);
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdrF); gl.viewport(0, 0, SIZE, SIZE);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(draw.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, trajT);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, partT);
  gl.uniform1i(draw.u.traj, 0); gl.uniform1i(draw.u.parts, 1);
  gl.uniformMatrix4fv(draw.u.mvp, false, camera(t));
  gl.uniform1f(draw.u.F, flow(t));
  gl.uniform1f(draw.u.t01, (t % CYCLE) / CYCLE);
  gl.uniform4f(draw.u.bLag, breath(t), breath(t - LAG), breath(t - 2 * LAG), breath(t - 3 * LAG));
  gl.uniform1i(draw.u.motion, MOTION); gl.uniform1i(draw.u.axisMode, { y: 0, z: 1, x: 2 }[WIND.axis]); gl.uniform1i(draw.u.spinMode, { y: 0, z: 1, x: 2 }[WIND.spinAxis || WIND.axis]);
  gl.uniform1f(draw.u.twist, WIND.twist); gl.uniform1f(draw.u.kH, WIND.kH); gl.uniform1f(draw.u.kS, WIND.kS);
  gl.uniform1f(draw.u.spin, WIND.spin * flow(t)); gl.uniform1f(draw.u.squash, WIND.squash); gl.uniform1f(draw.u.sMin, S_MIN);
  gl.uniform1f(draw.u.pscale, 5.2 * SIZE / 1080);
  gl.uniform1f(draw.u.alpha, 0.16 * (A.gain || 1));
  gl.uniform3fv(draw.u.c0, C[0]); gl.uniform3fv(draw.u.c1, C[1]); gl.uniform3fv(draw.u.c2, C[2]);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.POINTS, 0, N * TRAIL);
  gl.disable(gl.BLEND);

  gl.bindFramebuffer(gl.FRAMEBUFFER, blAF); gl.viewport(0, 0, QS, QS);
  gl.useProgram(down.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdrT);
  gl.uniform1i(down.u.a, 0); gl.uniform2f(down.u.px, 1 / QS, 1 / QS); quad();
  gl.useProgram(blur.p);
  for (let k = 0; k < 2; k++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, blBF); gl.bindTexture(gl.TEXTURE_2D, blA);
    gl.uniform1i(blur.u.a, 0); gl.uniform2f(blur.u.dir, (1 + k) / QS, 0); quad();
    gl.bindFramebuffer(gl.FRAMEBUFFER, blAF); gl.bindTexture(gl.TEXTURE_2D, blB);
    gl.uniform2f(blur.u.dir, 0, (1 + k) / QS); quad();
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, SIZE, SIZE);
  gl.useProgram(comp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdrT);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blA);
  gl.uniform1i(comp.u.parts, 0); gl.uniform1i(comp.u.bloom, 1);
  gl.uniform3fv(comp.u.bg0, lin(rgb(A.bg[0]))); gl.uniform3fv(comp.u.bg1, lin(rgb(A.bg[1]))); gl.uniform3fv(comp.u.glow, lin(rgb(A.glow)));
  gl.uniform1f(comp.u.b, b);
  quad();
  if (LABELS) setLabel(t);
  gl.finish();
}
window.renderFrame = renderFrame;
window.FRAMES = Math.round(CYCLE * FPS);
window.FLOW_NAME = A.name;

if (!Q.has('offline')) {
  const t0 = performance.now();
  const loop = () => { renderFrame((performance.now() - t0) / 1000 * FPS); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
